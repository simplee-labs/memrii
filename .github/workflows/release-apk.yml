# Builds the Android APK on GitHub's servers and attaches it to a release.
#
#   Push a tag (git tag memrii-v0.1.4+4 && git push origin memrii-v0.1.4+4)
#       builds that tag and attaches memrii-0.1.4+4.apk to its release. A release that
#       does not exist yet is created as a DRAFT, so nothing is public until you have
#       added the APK release notes and published it yourself. Plain v<version>
#       tags (the omi-offline scheme, v0.37.7 and earlier) are still accepted.
#   Actions tab → Release APK → Run workflow, tag left empty
#       builds the branch you picked and keeps the APK as a workflow artifact
#       (7 days). Nothing is released. This is the way to check a build.
#   Run workflow with a tag
#       builds that tag and attaches (or replaces) the APK on its release.
#
# Firmware is not built here: it needs the nRF Connect SDK, so the firmware zip
# (memrii-fw-<version>.zip) is built locally with the firmware toolchain and uploaded to its own
# memrii-fw-v<version> release. Firmware tags do not trigger this APK workflow.
#
# The build uses the public production entry point directly; owner scripts are local-only.

name: Release APK

on:
  push:
    tags: ['memrii-v*', 'v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'APK release tag (e.g. memrii-v0.1.4+4). Leave empty to build only.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-apk-${{ github.event_name == 'push' && github.ref_name || inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
      EXPECTED_CERT_SHA256: ${{ vars.MEMRII_CERT_SHA256 }}
      MEMRII_KEY_ALIAS: memrii-upload
      MEMRII_STORE_PASSWORD: ${{ secrets.MEMRII_STORE_PASSWORD }}
      MEMRII_KEY_PASSWORD: ${{ secrets.MEMRII_KEY_PASSWORD }}
      FLUTTER_VERSION: 3.41.7
      NDK_VERSION: 28.2.13676358

    steps:
      - name: Validate signing configuration
        env:
          MEMRII_KEYSTORE_BASE64: ${{ secrets.MEMRII_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$MEMRII_KEYSTORE_BASE64" || -z "$MEMRII_STORE_PASSWORD" || -z "$MEMRII_KEY_PASSWORD" || ! "$EXPECTED_CERT_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Configure the memrii signing secrets and MEMRII_CERT_SHA256 variable. Use the repository Actions settings to configure them."
            exit 1
          fi
          printf 'MEMRII_STORE_FILE=%s/memrii-upload.jks\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
        with:
          # A manual run with a tag builds that tag, not the branch it was started from.
          ref: ${{ env.TAG != '' && format('refs/tags/{0}', env.TAG) || github.ref }}
          fetch-depth: 1

      - name: Tag matches the app version
        if: env.TAG != ''
        run: |
          version="$(awk '/^version:/ {gsub(/\r/, "", $2); print $2; exit}' app/pubspec.yaml)"
          if [[ "$TAG" != "memrii-v$version" && "$TAG" != "v$version" ]]; then
            echo "::error::Tag $TAG does not match app/pubspec.yaml version $version (expected memrii-v$version)."
            exit 1
          fi
          echo "Tag $TAG matches app $version"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: gradle/actions/setup-gradle@v6

      - name: Android NDK
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ -d "$ANDROID_HOME/ndk/$NDK_VERSION" ]]; then
            echo "NDK $NDK_VERSION already installed"
          else
            # `yes` dies of SIGPIPE when sdkmanager stops reading, and this shell runs with
            # pipefail, so its exit status must not count.
            { yes || true; } | "$sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
            [[ -d "$ANDROID_HOME/ndk/$NDK_VERSION" ]] || { echo "::error::NDK $NDK_VERSION did not install"; exit 1; }
          fi

      - name: Prepare private signing key
        env:
          MEMRII_KEYSTORE_BASE64: ${{ secrets.MEMRII_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$MEMRII_KEYSTORE_BASE64" | base64 --decode > "$MEMRII_STORE_FILE"

      - name: Build
        run: |
          df -h / | tail -1
          version="$(awk '/^version:/ {gsub(/\r/, "", $2); print $2; exit}' app/pubspec.yaml)"
          (cd app && flutter build apk --release --flavor prod --target lib/main.dart)
          mkdir -p releases
          cp app/build/app/outputs/flutter-apk/app-prod-release.apk "releases/memrii-${version}.apk"
          df -h / | tail -1

      - name: Find the APK
        id: apk
        run: |
          shopt -s nullglob
          apks=(releases/*.apk)
          if [[ ${#apks[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one APK in releases/, found ${#apks[@]}: ${apks[*]}"
            exit 1
          fi
          echo "path=${apks[0]}" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "${apks[0]}" .apk)" >> "$GITHUB_OUTPUT"
          ls -l "${apks[0]}"

      - name: Signed with the memrii key
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          certs="$("$apksigner" verify --print-certs "${{ steps.apk.outputs.path }}")"
          echo "$certs"
          # The label before the digest differs by apksigner version ("Signer #1 certificate
          # SHA-256 digest:" locally, "V2 Signer: certificate SHA-256 digest:" on the runner),
          # so match the digest itself. One line per signature scheme, hence sort -u: more than
          # one distinct key left here would mean the APK carries a signer that is not ours.
          digests="$(printf '%s\n' "$certs" |
            sed -n 's/.*certificate SHA-256 digest: *\([0-9a-f]\{64\}\).*/\1/p' | sort -u)"
          if [[ "$digests" != "$EXPECTED_CERT_SHA256" ]]; then
            echo "::error::APK is not signed with the configured memrii key alone (got: ${digests//$'\n'/, })."
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 7
          compression-level: 0 # an APK is already compressed

      - name: Attach to the release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="${{ steps.apk.outputs.path }}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$apk" --clobber
            echo "Attached $(basename "$apk") to release $TAG"
          else
            version="$(awk '/^version:/ {gsub(/\r/, "", $2); print $2; exit}' app/pubspec.yaml)"
            gh release create "$TAG" "$apk" --draft --verify-tag --title "memrii APK ${version%+*}" \
              --notes "Android APK release created by the Release APK workflow. Add the app release notes, then publish. Firmware updates are published separately under memrii-fw-v<version>."
            echo "Created draft release $TAG with $(basename "$apk")"
          fi

      - name: Remove private runner key
        if: always()
        run: rm -f "${MEMRII_STORE_FILE:-$RUNNER_TEMP/memrii-upload.jks}"
