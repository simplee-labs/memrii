plugins {
   id "com.android.application"
   id "kotlin-android"
   id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def signingValue = { String environmentName, String propertyName ->
    System.getenv(environmentName) ?: keystoreProperties.getProperty(propertyName)
}
def releaseStoreFile = signingValue('MEMRII_STORE_FILE', 'storeFile')
def releaseKeyAlias = signingValue('MEMRII_KEY_ALIAS', 'keyAlias')
def releaseStorePassword = signingValue('MEMRII_STORE_PASSWORD', 'storePassword')
def releaseKeyPassword = signingValue('MEMRII_KEY_PASSWORD', 'keyPassword')

// Validate only production release tasks so debug/dev builds need no private key.
gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.project == project && it.name.toLowerCase().contains('prodrelease') }) {
        if (!releaseStoreFile || !releaseKeyAlias || !releaseStorePassword || !releaseKeyPassword) {
            throw new GradleException('memrii production signing is missing. Set MEMRII_STORE_FILE, MEMRII_KEY_ALIAS, MEMRII_STORE_PASSWORD and MEMRII_KEY_PASSWORD, or ignored android/key.properties. See Building in README.md and android/key.properties.example.')
        }
        if (!file(releaseStoreFile).isFile()) {
            throw new GradleException('memrii production keystore does not exist. See Building in README.md and android/key.properties.example.')
        }
    }
}


kotlin {
    jvmToolchain(21)
}

android {

    buildFeatures {
        buildConfig = true
    }

    namespace "me.memrii.app"


    // ----- BEGIN flavorDimensions (autogenerated by flutter_flavorizr) -----
    flavorDimensions += "flavor-type"

    productFlavors {
        prod {
            dimension "flavor-type"
            applicationId "me.memrii.app"
            resValue "string", "app_name", "memrii"
        }
        dev {
            dimension "flavor-type"
            applicationId "me.memrii.app.dev"
            resValue "string", "app_name", "memrii dev"
        }
    }

    // ----- END flavorDimensions (autogenerated by flutter_flavorizr) -----

    compileSdkVersion 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    lintOptions {
        disable 'InvalidPackage'
        checkReleaseBuilds false
    }

    defaultConfig {
        applicationId "me.memrii.app"
        minSdkVersion 26
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true

        // Strip out unsupported architectures from universal AARs (e.g. onnxruntime x86)
        // to prevent inflating the fat APK size.
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64'
        }
    }

    signingConfigs {
        release {
            keyAlias releaseKeyAlias
            keyPassword releaseKeyPassword
            storeFile releaseStoreFile ? file(releaseStoreFile) : null
            storePassword releaseStorePassword
        }
    }

    buildTypes {
        release {
            productFlavors.dev.signingConfig signingConfigs.debug
            productFlavors.prod.signingConfig signingConfigs.release
            // fixing calendar
            // https://github.com/builttoroam/device_calendar/issues/99#issuecomment-612449677
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            minifyEnabled false
            shrinkResources false
        }
        debug{
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            minifyEnabled false
        }
    }

    ndkVersion System.getenv()["NDK_VERSION"] ?: "28.2.13676358"
}

flutter {
    source '../..'
}

dependencies {
    androidTestImplementation 'androidx.test:runner:1.2.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.2.0'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.0-alpha3'
    implementation 'androidx.work:work-runtime-ktx:2.9.1'
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.22.0'
}
