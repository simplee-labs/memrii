# PM_DEVICE only — device power here is driven explicitly, never by refcount.
# sd_card.c wraps every SD operation in pm_device_action_run() on SPI3 + the card,
# spi_flash.c suspends the external NOR once at boot (main.c flash_off()), and the
# mic is gated at the dmic trigger by aad_apply_mic_gate(). PM_DEVICE_RUNTIME must
# stay OFF: it is refcounted, pm_device_action_run() bypasses the refcount, and
# mixing the two on one device desyncs it — on SPI3 that is a suspend landing under
# a live audio write. There is also nothing left for it to gate; what remains (TWIM
# for the IMU, SAADC every 60 s / 5 min) is noise.
CONFIG_PM_DEVICE=y
CONFIG_ADC=y
CONFIG_ADC_ASYNC=y
CONFIG_ADC_NRFX_SAADC=y
CONFIG_AUDIO=y
CONFIG_AUDIO_DMIC=y
CONFIG_FLASH=y
CONFIG_FLASH_JESD216_API=y
CONFIG_DISK_DRIVER_SDMMC=y
