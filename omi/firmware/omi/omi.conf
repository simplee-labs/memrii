# TX power belongs to the network core. This application core uses BT_HCI_IPC;
# boards/omi/omi_nrf5340_cpunet_defconfig selects BT_CTLR, CONFIG_BT_CTLR_TX_PWR_PLUS_3 (the nRF5340 maximum)
# and dynamic HCI power control.
#
# Do not set the nRF52840's +8 dBm option on this chip or application core. Advertising TX duty is about 0.1
# percent, so +3 to 0 dBm saves only single-digit microamps while losing 3 dB of link margin.
