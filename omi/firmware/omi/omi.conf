# On-device diagnostic event log. This fork ships a single build config, so the
# compile-time feature is enabled here; it stays OFF at runtime until a developer
# flips the Debug Tools toggle (default OFF, not persisted). Its 2 KB ring lives in the
# retained-RAM region described by boards/omi/pm_static.yml; inspect generated
# partitions to confirm the selected build's reservation. The ring is not a .bss
# allocation, and the SD worker stack remains 12 KB with or without this feature.
# Production currently enables it. Setting n would remove the capability/code;
# runtime collection and forced boot/recovery records have separate gates.
CONFIG_OMI_DIAG_LOG=y
CONFIG_OMI_VAD_DEBOUNCE_FRAMES=3
CONFIG_OMI_VAD_HOLD_MS=10000
CONFIG_OMI_ENABLE_T5838_AAD=y
